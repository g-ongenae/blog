<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="theme-color" content="#030806">
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-mark" href="{{ get_url(path='@/_index.md') }}">
          <span class="site-mark-prompt">$</span> G. ONGENAE
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ get_url(path='@/_index.md') }}">Blog</a>
          <a href="https://g-ongenae.github.io/">Main site <span aria-hidden="true">↗</span></a>
        </nav>
      </header>
      <main class="site-main">
      {% block content %}{% endblock content %}
      </main>
      <footer class="site-footer">
        <span>ONLINE / PARIS, FR</span>
        <span>FASTENING. VIBING. TELLING.</span>
      </footer>
    </div>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      mermaid.initialize({ startOnLoad: false, theme: "dark", themeVariables: {
        background: "#07150b", primaryColor: "#0b2815", primaryTextColor: "#d7ffdd",
        lineColor: "#5bbf6d", textColor: "#b2dcb8"
      }});

      for (const code of document.querySelectorAll("pre > code.language-mermaid")) {
        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      }

      await mermaid.run({ nodes: document.querySelectorAll(".mermaid") });
    </script>
  </body>
</html>
