name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: 'The commit SHA to publish (default: the latest commit on the main branch)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.sha || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
