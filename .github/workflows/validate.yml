name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.1
      - uses: actions/checkout@v6
      - run: python3 -m pip install -r requirements-build.txt
      - run: make generate
      - run: zola check
      - run: zola build
      - run: node scripts/test-router.mjs
      - run: python3 scripts/check-tree.py
