base_url = "https://g-ongenae.github.io/blog"
title = "G. Ongenae"
compile_sass = false
build_search_index = false

[markdown]
highlight_code = true
# Renders `> [!NOTE]` and the other GitHub alerts as `blockquote.markdown-alert-*`.
github_alerts = true

[link_checker]
# Instagram answers 429 Too Many Requests to unauthenticated checks from CI runners.
# centremomboye.com fails the TLS handshake (expired certificate) since 2026-11-16;
# drop it from this list once the site serves a valid certificate again.
skip_prefixes = ["https://www.instagram.com/", "https://www.centremomboye.com/"]
